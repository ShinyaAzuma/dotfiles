# 基本設定
set -sg escape-time 10
set -g history-limit 64096
setw -g mode-keys vi

# プレフィックスをCtrl+tに変更
set-option -g prefix C-t
unbind C-b
bind C-t send-prefix

# vim風のペイン移動
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Lazygit をポップアップで開く
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# ペイン分割
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# プロジェクトランチャー（sesh + zoxide + fzf）: prefix + o
# 実行中セッション / zoxide 履歴 / sesh.toml 定義 をまとめて曖昧検索 → 起動 or 復帰
# ^a 全候補  ^t tmuxセッション  ^x zoxide履歴  ^d 選択セッションをkill
bind o run-shell "sesh connect \"\$(\
  sesh list --icons | fzf-tmux -p 60%,55% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^x zoxide ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
)\""

# Claude Code アカウント別ランチャー（Ctrl+t a a: default / Ctrl+t a r: Rewire）
bind a switch-client -T claude-account

# Claude Code をポップアップで開く（default: ディレクトリごとにセッション維持）
bind -T claude-account a run-shell '\
  SESSION="claude-default-$(echo #{pane_current_path} | md5 | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude --permission-mode auto"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# Claude Code をポップアップで開く（Rewire: ディレクトリごとにセッション維持）
bind -T claude-account r run-shell '\
  SESSION="claude-rewire-$(echo #{pane_current_path} | md5 | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "env CLAUDE_CONFIG_DIR=$HOME/.claude-rewire claude --permission-mode auto"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# Codex をポップアップで開く（ディレクトリごとにセッション維持）
bind -r X run-shell '\
  SESSION="codex-$(echo #{pane_current_path} | md5 | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "codex -a never"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# セッション終了時に未アタッチのClaude Code/Codexセッションも終了
set-hook -g session-closed 'run-shell "tmux list-sessions -F \"##{session_name} ##{session_attached}\" 2>/dev/null | grep \"^\\(claude\\|codex\\)-.* 0$\" | cut -d\" \" -f1 | xargs -I{} tmux kill-session -t {} 2>/dev/null || true"'

# マウス操作を有効化
set -g mouse on

# 256色対応
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# インデックスを1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ名を自動変更しない
set-option -g allow-rename off

# ===== プラグイン =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# セッション永続化（再起動後も復元）
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'  # ペインの表示内容も保存
set -g @continuum-restore 'on'                 # tmux 起動時に前回のセッションを自動復元
# continuum の status-right 経由の自動保存は無効化（TUI再描画のたびに走りCPUを焼くため）。
# 代わりに bin/tmux-resurrect-autosave がバックグラウンドで定期保存する（下部参照）。
set -g @continuum-save-interval '0'

# テーマ設定
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format YMD
set -g @tokyo-night-tmux_time_format 24H

# git ステータス widget を無効化（iCloud上のパスでgitを毎回叩きtmuxサーバーがCPUを焼くため）
set -g @tokyo-night-tmux_show_git 0
set -g @tokyo-night-tmux_show_wbg 0

set -g focus-events on

# フォーカス時にIMEを英数に自動切替（Slackなどから戻った時の対策）
# ポップアップ内では誤入力の原因になるためスキップ
set-hook -g client-focus-in 'if-shell "[ -z \"$TMUX_POPUP\" ]" "run-shell \"osascript -e \\\"tell application \\\\\\\"System Events\\\\\\\" to key code 102\\\"\""'

# TPM初期化（最後に記述）
run '~/.tmux/plugins/tpm/tpm'

# ステータスバー更新間隔（プラグイン既定の15秒だとwidget群のbash spawnが多すぎてCPUを焼くため上書き）
set -g status-interval 60

# ===== ステータスバー軽量化 =====
# tokyo-night-tmux の status-left/right は #() シェルwidgetを多数含み、
# Claude Code等のTUIペインが頻繁に再描画するたびに毎回 bash を spawn して
# tmuxサーバーのCPUを焼く。色は維持しつつ #() を最小化する。
# - 時計: サブプロセスを使わず tmux ネイティブの strftime に置換
# - hostname / netspeed / music / path / battery / git / continuum widget を削除
# - 時計は #() を使わず strftime のみ（サブプロセス0個）
set -g status-left "#[fg=#2A2F41,bg=#7aa2f7,bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#S "
set -g status-right "#[fg=#7aa2f7,bg=default] %Y-%m-%d %H:%M "

# セッション自動保存をバックグラウンドに移行（多重起動ガード付き・15分おき）
run-shell -b "pgrep -f tmux-resurrect-autosave >/dev/null 2>&1 || nohup ~/dotfiles/bin/tmux-resurrect-autosave 900 >/dev/null 2>&1 &"
# コピーモード設定
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
