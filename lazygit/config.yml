# lazygit 0.62 で、コミット説明エディタの確定キーが alt+enter から
# meta+enter（macOS では cmd+enter）に変わった。cmd 系は端末が自分で解釈することが多く、
# Ghostty から lazygit の TUI まで届く保証がない。確実に動く alt+enter を明示的に戻す。
# Ghostty 側は macos-option-as-alt = true なので option+enter が alt+enter として届く。
keybinding:
  universal:
    confirmInEditor: [<alt+enter>, <ctrl+s>]

# 差分の見た目を git 側（~/.config/git/config）と揃える。
# --paging=never は lazygit が自前でスクロールを持つため。
#
# キーは pagers（リスト）。旧形式の paging（マップ）で書くと lazygit が起動時に
# 設定ファイルをその場で書き換えて移行する。このファイルは dotfiles からの
# symlink なので、書き換えられるとリポジトリに差分が出てしまう。
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
